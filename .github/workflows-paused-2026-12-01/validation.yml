name: Validación Ciudad Viva
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ciudad-viva-validacion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis y JSON
        id: syntax
        run: |
          python -m py_compile server.py public_servers.py scripts/smoke_public_directory.py desktop_app.py taxi_passengers.py growth_demand.py bus_nonwork.py metro.py rail_bus_intermodal.py rail_sites.py rail_freight.py essential_services.py
          node --check offline.js
          node --check taxi_passengers.js
          node --check bus_nonwork.js
          node --check rail_bus_intermodal.js
          node --check metro.js
          node --check rail_sites.js
          node --check rail_freight.js
          node --check essential_services.js
          node --check metro_visuals.js
          node --check growth_demand.js
          node --check offline_client.js
          node --check offline_worker.js
          node --check traffic.js
          node --check simulation_time.js
          node --check game.js
          node --check beginnerTutorial.js
          node --check cityInsights.js
          node --check city-companion.js
          node --check cursor_motion.js
          node --check cursor_presence.js
          node --check world3d.js
          node --check city_spectacle_state.js
          node --check city_spectacle_3d.js
          node --check city_cinema.js
          node --check living_city.js
          node --check living_city_3d.js
          node --check living_city_ui.js
          node --check city_immersive_state.js
          node --check city_immersive_3d.js
          node --check online_engine.mjs
          node --check public_rtc.js
          python -m py_compile shared_engine.py
          node --check cityGuide.js
          node --check reference-ui.js
          python -m json.tool public_directory.json > /dev/null
          python -m json.tool release_notes.json > /dev/null
          python -m json.tool offline_seed.json > /dev/null
      - name: Regresión Online
        id: online
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: "Directorio Supabase en vivo: publicar, leer, proteger y retirar"
        run: python scripts/smoke_public_directory.py
      - name: Regresión Offline
        run: node --test tests/*_offline.mjs tests/test_city_guide.mjs tests/test_beginner_tutorial.mjs tests/test_city_insights.mjs tests/test_city_spectacle.mjs tests/test_living_city.mjs tests/test_city_immersive.mjs tests/test_traffic_model.mjs tests/test_simulation_time.mjs tests/test_metro_visuals.mjs
      - name: Cursores multijugador y presencia
        run: node --test tests/test_cursor_motion.mjs tests/test_cursor_presence.mjs
      - name: Stress económico 30 años (cinco perfiles)
        if: ${{ !cancelled() && steps.syntax.outcome == 'success' && steps.online.outcome == 'success' }}
        run: python tests/stress_30_years.py
      - name: Empaquetar entrega completa
        uses: actions/upload-artifact@v4
        with:
          name: ciudad-viva-alfa-0.289
          path: |
            .
            !.git/**
            !__pycache__/**
            !tests/__pycache__/**
            !ciudad_guardada.json
            !**/*.zip
            !node_modules/**
            !scratch/**
            !ui-captures/**
          include-hidden-files: true
          retention-days: 90

  responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de pruebas
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: WebRTC P2P, configuración bajo subruta y limpieza de invitados
        run: node tests/test_public_webrtc_ui.mjs
      - name: "Tutorial narrado: móvil y escritorio"
        run: node tests/test_beginner_tutorial_ui.mjs
      - name: "Asesor, misiones, previsiones y barrios: móvil y escritorio"
        run: node tests/test_city_companion_ui.mjs
      - name: "Ciudad viva en 3D y cámara: móvil y escritorio"
        run: node tests/test_city_spectacle_ui.mjs
      - name: "Historias, obras, tráfico y plazas en 3D: móvil y escritorio"
        run: node tests/test_living_city_ui.mjs
      - name: "La ciudad respira: colectivos, fábricas, puerto, animales y emergencias 3D"
        run: node tests/test_city_immersive_ui.mjs
      - name: Comprobar UI, construcción y Economía (390/1440 px)
        run: |
          tests=(
            tests/test_treasury_metric_ui.mjs
            tests/test_demolition_ui.mjs
            tests/test_essential_services_ui.mjs
            tests/test_metro_ui.mjs
            tests/test_bus_route_ui.mjs
            tests/test_offline_boot_recovery.mjs
            tests/test_growth_demand_ui.mjs
            tests/test_instant_public_services_ui.mjs
            tests/test_camera_markers.mjs
            tests/test_ui_layout.mjs
            tests/test_utility_response_ui.mjs
            tests/test_municipal_forecast_ui.mjs
            tests/test_school_expansion_ui.mjs
            tests/test_school_commute_ui.mjs
            tests/test_build_preview_ui.mjs
            tests/test_property_acquisition_ui.mjs
            tests/test_public_room_directory_ui.mjs
            tests/test_port_import_ui.mjs
            tests/test_funeral_ui.mjs
            tests/test_land_expansion_ui.mjs
            tests/test_municipal_approvals_ui.mjs
            tests/test_new_settlement_traffic_ui.mjs
            tests/test_traffic_signal_ui.mjs
            tests/test_citizen_inbox_ui.mjs
            tests/test_taxi_route_ui.mjs
          )
          status=0
          for test in "${tests[@]}"; do
            echo "::group::$test"
            if ! node "$test"; then status=1; fi
            echo "::endgroup::"
          done
          exit "$status"
      - name: Informe responsive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciudad-viva-alfa-0.289-responsive
          path: ui-captures/
          if-no-files-found: ignore
          retention-days: 30
