name: Publicar Ciudad Viva en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.webp'
      - '*.ico'
      - 'offline_seed.json'
      - 'release_notes.json'
      - 'vendor/**'
      - 'assets/**'
      - 'images/**'
      - 'audio/**'
      - 'fonts/**'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ciudad-viva-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Leer main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar solamente el juego público
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          # Nunca publicar el servidor Python, partidas guardadas, tests,
          # documentación interna, archivos ocultos ni configuraciones.
          find . -maxdepth 1 -type f \
            \( -name '*.html' -o -name '*.js' -o -name '*.css' \
               -o -name '*.svg' -o -name '*.png' -o -name '*.jpg' \
               -o -name '*.jpeg' -o -name '*.webp' -o -name '*.gif' \
               -o -name '*.ico' -o -name '*.woff2' -o -name '*.wasm' \) \
            -exec cp -- '{}' _site/ \;
          cp offline_seed.json release_notes.json _site/
          for dir in vendor assets images audio fonts; do
            if [ -d "$dir" ]; then cp -R "$dir" "_site/$dir"; fi
          done
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/game.js
          test -s _site/offline.js
          test -s _site/vendor/three.module.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("_site")
          v=json.loads((root/"release_notes.json").read_text(encoding="utf-8"))["currentVersion"]
          html=(root/"index.html").read_text(encoding="utf-8")
          assert f'content="{v}"' in html, "Alfa desactualizada: no publicar"
          forbidden=[p for p in root.rglob("*") if p.is_file() and (
              p.suffix in (".py", ".env", ".md", ".bat", ".sh", ".pem", ".key") or
              p.name in ("ciudad_guardada.json", ".git", ".gitignore")
          )]
          assert not forbidden, f"Archivos privados en sitio: {forbidden}"
          print("Sitio estático preparado; Alfa",v)
          PY

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
