name: App anfitrión Windows
on:
  push:
    branches: [main]
    paths:
      - 'server.py'
      - 'public_servers.py'
      - 'shared_engine.py'
      - 'online_engine.mjs'
      - 'desktop_app.py'
      - 'desktop_app.spec'
      - 'requirements-desktop.txt'
      - 'index.html'
      - '*.css'
      - '*.js'
      - '*.mjs'
      - '*.json'
      - 'assets/**'
      - 'vendor/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server.py'
      - 'public_servers.py'
      - 'shared_engine.py'
      - 'online_engine.mjs'
      - 'desktop_app.py'
      - 'desktop_app.spec'
      - 'requirements-desktop.txt'
      - 'index.html'
      - '*.css'
      - '*.js'
      - '*.mjs'
      - '*.json'
      - 'assets/**'
      - 'vendor/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-host-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Incluir Node.js dentro del ejecutable Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime | Out-Null
          Copy-Item -Path (Get-Command node.exe).Source -Destination runtime/node.exe
          & runtime/node.exe --version
      - name: Incluir el conector público dentro del ejecutable Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe'
          Invoke-WebRequest -Uri $url -OutFile runtime/cloudflared.exe
          & runtime/cloudflared.exe --version
      - name: Instalar empaquetador y ventana integrada
        run: pip install -r requirements-desktop.txt
      - name: Empaquetar Ciudad Viva
        run: pyinstaller --noconfirm --clean desktop_app.spec
      - id: release_version
        name: Leer versión de la partida
        shell: pwsh
        run: |
          $version = python -c "import json; print(json.load(open('release_notes.json', encoding='utf-8'))['currentVersion'])"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Adjuntar ejecutable al historial de versiones
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          name: Ciudad Viva Alfa ${{ steps.release_version.outputs.version }} · LAN e Internet
          body: |
            Aplicación Windows con motor de ciudad, servidor LAN y conexión pública experimental integrada.
            El anfitrión aloja y guarda la partida en su propia PC. Internet usa un túnel Cloudflare temporal.
            WebRTC directo con señalización Supabase y Cloudflare como respaldo experimental.
            Cada anfitrión ejecuta y guarda la ciudad en su propia PC. Ver PUBLIC_SERVERS.md.
          files: dist/CiudadViva.exe
          prerelease: true
          fail_on_unmatched_files: true
