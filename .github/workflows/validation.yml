name: Validación Ciudad Viva
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ciudad-viva-validacion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis y JSON
        run: |
          python -m py_compile server.py
          node --experimental-default-type=module --check offline.js
          node --experimental-default-type=module --check game.js
          node --experimental-default-type=module --check world3d.js
          node --experimental-default-type=module --check cityGuide.js
          node --experimental-default-type=module --check reference-ui.js
          python -m json.tool release_notes.json > /dev/null
          python -m json.tool offline_seed.json > /dev/null
      - name: Regresión Online
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Regresión Offline
        run: node --experimental-default-type=module --test tests/*_offline.mjs tests/test_city_guide.mjs
      - name: Stress económico 30 años (cuatro perfiles)
        run: python tests/stress_30_years.py
      - name: Empaquetar entrega completa
        uses: actions/upload-artifact@v4
        with:
          name: ciudad-viva-alfa-0.110
          path: |
            .
            !.git/**
            !__pycache__/**
            !tests/__pycache__/**
            !ciudad_guardada.json
          include-hidden-files: true
          retention-days: 90

  responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Comprobar UI y panel Economía (390/1440 px)
        run: node tests/test_ui_layout.mjs && node tests/test_utility_response_ui.mjs
      - name: Capturas de comprobación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciudad-viva-alfa-0.110-responsive
          path: ui-captures/
          if-no-files-found: ignore
          retention-days: 30
