name: Validación Ciudad Viva
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ciudad-viva-validacion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis y JSON
        run: |
          python -m py_compile server.py
          node --experimental-default-type=module --check offline.js
          node --experimental-default-type=module --check game.js
          node --experimental-default-type=module --check world3d.js
          python -m json.tool release_notes.json > /dev/null
          python -m json.tool offline_seed.json > /dev/null
      - name: Regresión Online
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Regresión Offline
        run: node --experimental-default-type=module --test tests/test_materials_offline.mjs tests/test_industry_offline.mjs tests/test_industrial_recovery_offline.mjs tests/test_industrial_competition_offline.mjs tests/test_private_construction_supply_offline.mjs tests/test_private_staffing_offline.mjs tests/test_forward_contracts_offline.mjs tests/test_retail_road_access_offline.mjs tests/test_maritime_steel_import_offline.mjs tests/test_tourism_events_offline.mjs tests/test_hospital_care_offline.mjs tests/test_police_offline.mjs
      - name: Stress económico 30 años (cuatro perfiles)
        run: python tests/stress_30_years.py
      - name: Empaquetar entrega completa
        uses: actions/upload-artifact@v4
        with:
          name: ciudad-viva-alfa-0.103
          path: |
            .
            !.git/**
            !__pycache__/**
            !tests/__pycache__/**
            !ciudad_guardada.json
          include-hidden-files: true
          retention-days: 90

  responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Comprobar UI y panel Economía (390/1440 px)
        run: node tests/test_ui_layout.mjs
      - name: Capturas de comprobación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciudad-viva-alfa-0.103-responsive
          path: ui-captures/
          if-no-files-found: ignore
          retention-days: 30
