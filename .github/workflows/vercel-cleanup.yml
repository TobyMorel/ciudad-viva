name: Vercel deployment cleanup
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ciudad-viva-vercel-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Delete old deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_IDS: prj_wh9aoQeN5RkzYQaxvGB0xE7z6Ksi
          VERCEL_TEAM_ID: team_KPxPfebDgL6MlGlV711WEPwg
        run: node .github/scripts/cleanup-vercel.mjs
